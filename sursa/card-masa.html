<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Cartonaș de masă — {{logoShort}}</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../assets/css/style.css?v={{vCss}}">
  <style>
    /* Două cartonașe A6 (105 × 148 mm) pe o foaie A4 culcată, cu semne de tăiere. */
    @page { size: A4 landscape; margin: 0; }
    html, body { margin: 0; background: #e9e4dc; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet { width: 297mm; height: 210mm; display: flex; align-items: center; justify-content: center; gap: 12mm; background: #fff; margin: 0 auto; }
    .card { position: relative; width: 105mm; height: 148mm; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; padding: 11mm 10mm 9mm; box-sizing: border-box; color: #f5eee4; text-align: center;
      background:
        url("../assets/img/nervuri-stanga.svg") left -8mm top -20mm / 46mm auto repeat-y,
        url("../assets/img/nervuri-dreapta.svg") right -8mm top 30mm / 46mm auto repeat-y,
        #1f1612; }
    .card::after { content: ""; position: absolute; inset: 4mm; border: .25mm solid #d9b08a40; border-radius: 3mm; pointer-events: none; }
    .card .wordmark { justify-self: center; color: #f5eee4; }
    .card .wordmark span { font-size: 26pt; }
    .card .wordmark small { font-size: 7pt; }
    .card-mid { display: grid; align-content: center; justify-items: center; gap: 4mm; }
    .card h1 { margin: 0; font: 600 34pt/1 var(--serif); letter-spacing: -.01em; }
    .card h1 em { font-style: italic; color: #d9b08a; }
    .qr { width: 46mm; height: 46mm; padding: 4mm; background: #f5eee4; border-radius: 4mm; }
    .qr svg { display: block; width: 100%; height: 100%; }
    .hint { margin: 0; font: 600 7.5pt/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #d9b08a; }
    .card-foot { display: grid; gap: 1.5mm; }
    .card-foot p { margin: 0; font: italic 500 12pt/1.25 var(--serif); }
    .card-foot small { font: 500 6.5pt/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: #f5eee499; }
    @media screen { body { padding: 10mm 0; } .sheet { box-shadow: 0 4mm 12mm #0002; } }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="card">
      <span class="wordmark">{{logo}}</span>
      <div class="card-mid">
        <h1>Meniul e <em>aici</em></h1>
        <div class="qr" role="img" aria-label="Cod QR spre meniu">{{qr}}</div>
        <p class="hint">Deschide camera telefonului</p>
      </div>
      <div class="card-foot">
        <p>Ți-a plăcut? Lasă-ne o recenzie, tot de acolo.</p>
        <small>{{cityD}} · {{addressD}}</small>
      </div>
    </div>
    <div class="card">
      <span class="wordmark">{{logo}}</span>
      <div class="card-mid">
        <h1>Meniul e <em>aici</em></h1>
        <div class="qr" role="img" aria-label="Cod QR spre meniu">{{qr}}</div>
        <p class="hint">Deschide camera telefonului</p>
      </div>
      <div class="card-foot">
        <p>Ți-a plăcut? Lasă-ne o recenzie, tot de acolo.</p>
        <small>{{cityD}} · {{addressD}}</small>
      </div>
    </div>
  </div>
</body>
</html>
